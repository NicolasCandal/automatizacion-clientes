minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Check all source and tests with Ruff
        entry: >
          poetry run ruff check src typings tests
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Check formatting across the project
        entry: >
          poetry run ruff format --check src typings tests
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: Check types across the project
        entry: poetry run mypy
        language: system
        pass_filenames: false
        always_run: true
