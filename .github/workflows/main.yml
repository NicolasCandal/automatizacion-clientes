name: Quality and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    env:
      POETRY_NO_INTERACTION: "1"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: python -m pip install "poetry==2.3.1"
      - name: Validate configuration and lock file
        run: poetry check --lock
      - name: Install dependencies
        run: poetry sync --with dev
      - name: Check all source and tests
        run: >
          poetry run ruff check src typings tests
      - name: Check project formatting
        run: >
          poetry run ruff format --check src typings tests
      - name: Check types across the project
        run: poetry run mypy
      - name: Run unit and regression tests
        run: >
          poetry run pytest
          --cov=client_automation
          --cov-report=term-missing
          --cov-report=xml
      - name: Build distributions
        run: poetry build
